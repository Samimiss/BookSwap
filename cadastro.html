    <!-- Cabeçalho -->

    <div class="logo">
      <span class="logo-text">BookSwap</span>

    <nav class="nav-links">
      <a href="#">Início</a>
      <a href="#livros">Livros</a>
      <a href="#">Ajuda</a>
      <a href="#">Conta</a>
    </nav>
  </header>

    <!-- Conteúdo principal -->
    <main>

        <section class="cadastro-container">

             <div class="cat">

            <svg
                viewBox="0 0 100 90"
                xmlns="http://www.w3.org/2000/svg"

                <path

                    d="M27 48 Q33 43 39 48"

        </div>

            <h1>Crie sua conta</h1>

            <p class="subtitulo">
                Entre para a comunidade e comece a trocar histórias.
            </p>


            <!-- Formulário -->
            <div class="form-box">

                <form>

                    <!-- Nome -->
                    <div class="campo">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>


                    <!-- E-mail -->
                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                            required
                        >

                    </div>


                    <!-- Senha -->
                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Crie uma senha"
                            required
                        >

                    </div>


                    <!-- Confirmar senha -->
                    <div class="campo">

                        <label for="confirmar">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar"
                            placeholder="Digite a senha novamente"
                            required
                        >

                    </div>


                    <!-- Botão -->
                    <button
                        type="submit"
                        class="btn-cadastrar"
                    >
                        Criar conta
                    </button>

                </form>


                <!-- Link para login -->
                <p class="login">
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </div>

        </section>

    </main>

</body>
