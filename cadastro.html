<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta</title>

    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Estrelas -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>


    <!-- Cabeçalho -->
    <header>

        <img
            src="logo.png"
            alt="BookSwap"
            class="logo"
        >

        <nav>
            <a href="index.html">Início</a>
            <a href="livros.html">Livros</a>
            <a href="ajuda.html">Ajuda</a>
            <a href="login.html">Conta</a>
        </nav>

    </header>


    <!-- Conteúdo principal -->
    <main>

        <section class="cadastro-container">

            <div class="cat">🐱</div>

            <h1>Crie sua conta</h1>

            <p class="subtitulo">
                Entre para a comunidade e comece a trocar histórias.
            </p>


            <!-- Formulário -->
            <div class="form-box">

                <form>

                    <!-- Nome -->
                    <div class="campo">

                        <label for="nome">
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                        >

                    </div>


                    <!-- E-mail -->
                    <div class="campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                            required
                        >

                    </div>


                    <!-- Senha -->
                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Crie uma senha"
                            required
                        >

                    </div>


                    <!-- Confirmar senha -->
                    <div class="campo">

                        <label for="confirmar">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar"
                            placeholder="Digite a senha novamente"
                            required
                        >

                    </div>


                    <!-- Botão -->
                    <button
                        type="submit"
                        class="btn-cadastrar"
                    >
                        Criar conta
                    </button>

                </form>


                <!-- Link para login -->
                <p class="login">
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </div>

        </section>

    </main>

</body>

</html>
