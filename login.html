<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookSwap — Login</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- ESTRELAS -->
    <div class="stars">
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
    </div>

    <!-- HEADER -->
    <header class="navbar">
    <div class="logo">
      <span class="logo-text">BookSwap</span>
    </div>
    <nav class="nav-links">
      <a href="#">Início</a>
      <a href="#livros">Livros</a>
      <a href="#">Ajuda</a>
      <a href="#">Conta</a>
    </nav>
  </header>

    <!-- LOGIN -->
    <main>

        <div class="login-container">

                    <div class="cat">

            <svg
                viewBox="0 0 100 90"
                xmlns="http://www.w3.org/2000/svg"
                aria-label="Gato"
            >

               
                <path
                    class="cat-line"
                    d="
                        M18 38
                        L14 12
                        Q14 7 19 10
                        L34 18

                        Q42 14 50 14
                        Q58 14 66 18

                        L81 10
                        Q86 7 86 12
                        L82 38

                        Q88 48 88 58
                        Q88 78 50 80
                        Q12 78 12 58
                        Q12 48 18 38
                        Z
                    "
                />

                
                <path
                    class="cat-line"
                    d="M27 48 Q33 43 39 48"
                />

                
                <path
                    class="cat-line"
                    d="M61 48 Q67 43 73 48"
                />

                
                <path
                    class="cat-fill"
                    d="
                        M47 56
                        Q50 53 53 56
                        Q50 60 47 56
                        Z
                    "
                />

                
                <path
                    class="cat-line"
                    d="M50 59 L50 63"
                />

                <path
                    class="cat-line"
                    d="M50 63 Q45 68 40 64"
                />

                <path
                    class="cat-line"
                    d="M50 63 Q55 68 60 64"
                />

                
                <path
                    class="cat-line"
                    d="M37 58 L12 53"
                />

                <path
                    class="cat-line"
                    d="M37 63 L10 63"
                />

                <path
                    class="cat-line"
                    d="M37 67 L14 74"
                />

                
                <path
                    class="cat-line"
                    d="M63 58 L88 53"
                />

                <path
                    class="cat-line"
                    d="M63 63 L90 63"
                />

                <path
                    class="cat-line"
                    d="M63 67 L86 74"
                />

            </svg>

        </div>
        <!-- TÍTULO -->
            <h1>
                Bem-vindo
                de volta
            </h1>
    </div>

            

            <p class="subtitle">
                Entre na sua conta e continue
                trocando histórias.
            </p>

            <!-- CARD -->
            <div class="login-card">

                <form>

                    <!-- E-MAIL -->
                    <div class="input-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                            required
                        >

                    </div>

                    <!-- SENHA -->
                    <div class="input-group">

                        <div class="password-row">

                            <label for="password">
                                Senha
                            </label>

                            <a href="#" class="forgot">
                                Esqueci minha senha
                            </a>

                        </div>

                        <input
                            type="password"
                            id="password"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>

                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Entrar
                    </button>

                </form>

                <!-- CADASTRO -->
                <p class="register">
                    Ainda não tem uma conta?
                    <a href="#">
                        Criar conta
                    </a>
                </p>

            </div>

        </div>

    </main>

</body>

</html>
