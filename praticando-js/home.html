<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Praticando JS</title>
</head>

<body>
    <main>
        <h1> Praticando JS</h1>
        <section>
            <h2>Trocar um nome na tela </h2>
            <input type="text" id="nome-entrada" placeholder="informe seu nome">
            <button id="btn-troca">Trocar nome</button>
            <p> Olá <b id="nome-saida">Visitante</b></p>
        </section>
        <section>
            <h2>Alterando a cor da caixa</h2>
            <div id="caixa"> Aqui caixa </div>
            <button id="btn_miau" class="btn">MIAU</button>
            <button id="btn_auau" class="btn">AUAU</button>
            <button id="btn_oinc" class="btn">OINC</button>
        </section>
        <h2> Simulando adição e subtração de valor</h2>
        <section class="area_add_sub">

            <button id="btn_mais"> + </button>
            <p id="valor_real">0</p>
            <button id="btn_menos"> - </button>
        </section>
        <h2> Adicionando livros </h2>
        <section class="area-livros">
            <input type="text" id="nome_livro">
            <button id="adiciona_livro"> Adicionar</button>
            <ul id="lista_livros"></ul>
        </section>
    </main>
    <script src="home.js"> </script>
</body>

</html>
